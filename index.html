<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Changing the browser tab title to look completely normal -->
    <title>New Tab</title>
    <style>
        body, html {
            background-color: #11111b;
            color: #cdd6f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .dashboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            background-color: #11111b;
            transition: transform 0.5s ease-in-out;
        }
        .dashboard-container.hidden {
            transform: translateY(-100%);
        }
        .card {
            background-color: #1e1e2e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 420px;
            border: 1px solid #313244;
        }
        .logo-shield {
            width: 80px;
            height: 80px;
            background-color: #ff5555;
            border-radius: 18px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #11111b;
            box-shadow: 0 0 20px rgba(255, 85, 85, 0.3);
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            color: #a6adc8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-bar {
            flex: 1;
            padding: 14px 20px;
            background-color: #313244;
            border: 2px solid #45475a;
            border-radius: 12px;
            color: #cdd6f4;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar:focus {
            border-color: #ff5555;
        }
        .btn-launch {
            padding: 0 24px;
            background-color: #ff5555;
            color: #11111b;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-launch:hover {
            opacity: 0.9;
        }
        .viewport-container {
            width: 100vw;
            height: 100vh;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="dashboard-container" id="panel">
        <div class="card">
            <div class="logo-shield">M</div>
            <!-- Removed the word "Proxies" from the UI elements -->
            <h1>Miguel</h1>
            <div class="subtitle">Private Web Hub</div>
            <div class="search-box">
                <input type="text" id="urlInput" class="search-bar" placeholder="Enter URL (e.g., example.com)...">
                <button class="btn-launch" onclick="handleNavigation()">Go</button>
            </div>
        </div>
    </div>

    <div class="viewport-container" id="viewport">
        <iframe id="webFrame" src=""></iframe>
    </div>

    <script>
        function handleNavigation() {
            let input = document.getElementById('urlInput').value.trim();
            if (!input) return;

            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                input = 'https://' + input;
            }

            const panel = document.getElementById('panel');
            const viewport = document.getElementById('viewport');
            const frame = document.getElementById('webFrame');

            panel.classList.add('hidden');
            viewport.style.display = 'block';
            frame.src = input;
        }

        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleNavigation();
            }
        });
    </script>
</body>
</html>
