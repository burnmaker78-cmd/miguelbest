<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miguel Proxies Dashboard</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #252538;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 { margin-bottom: 5px; color: #ff5555; }
        p { color: #a6adc8; }
    </style>
</head>
<body>
    <div class="card">
        <img src="index.svg" width="100" height="100" alt="Logo">
        <h1>Miguel Proxies</h1>
        <p>Private Configuration Dashboard</p>
    </div>
</body>
</html>
